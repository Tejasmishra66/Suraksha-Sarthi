version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app/backend
    environment:
      - PORT=4000
  frontend:
    build: ./frontend
    ports:
      - '5173:3000'
    depends_on:
      - backend
